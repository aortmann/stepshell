name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: test -z "$(gofmt -l internal cmd)" || (gofmt -l internal cmd; exit 1)
      - run: go test ./...
      - run: go build ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: ./node_modules/.bin/tsc --noEmit
      - run: node build.mjs

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          helm lint charts/stepshell \
            --set baseURL=https://s.example.com \
            --set oidc.issuer=https://i --set oidc.clientID=c
