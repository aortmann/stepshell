{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stepshell.fullname" . }}
  labels:
    {{- include "stepshell.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $dexPath := "" }}
    {{- if .Values.dex.enabled }}
    {{- $u := urlParse (include "stepshell.oidc.issuer" .) }}
    {{- $dexPath = $u.path }}
    {{- end }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* Dex path first so it matches before the SPA catch-all. */ -}}
          {{- if $dexPath }}
          - path: {{ $dexPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "stepshell.dex.fullname" $ }}
                port:
                  number: 5556
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "stepshell.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
