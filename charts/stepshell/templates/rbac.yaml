{{- if .Values.rbac.create }}
# The server impersonates the logged-in user for every Kubernetes call, so it
# needs impersonate rights and nothing else. What a user can actually do is
# decided by the cluster's own RBAC for that user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stepshell.fullname" . }}-impersonator
  labels:
    {{- include "stepshell.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    {{- with .Values.rbac.allowedGroups }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stepshell.fullname" . }}-impersonator
  labels:
    {{- include "stepshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stepshell.fullname" . }}-impersonator
subjects:
  - kind: ServiceAccount
    name: {{ include "stepshell.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
