{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stepshell.fullname" . }}
  labels:
    {{- include "stepshell.labels" . | nindent 4 }}
  annotations:
    # Keep the generated session key stable across `helm upgrade`.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The Secret's value is what the server decodes as base64 into 32 raw bytes.
  # stepshell.sessionKeyB64 already yields base64 (explicit value, preserved
  # value, or randBytes), so no further encoding here.
  session-key: {{ include "stepshell.sessionKeyB64" . | quote }}
  {{- if eq .Values.authMode "oidc" }}
  {{- if .Values.dex.enabled }}
  # Shared secret between stepshell and the bundled Dex static client.
  oidc-client-secret: {{ include "stepshell.dex.clientSecretB64" . | quote }}
  # GitHub OAuth app secret consumed by Dex's github connector.
  dex-github-client-secret: {{ required "dex.github.clientSecret is required when dex.enabled" .Values.dex.github.clientSecret | b64enc | quote }}
  {{- else }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
