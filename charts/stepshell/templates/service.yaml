apiVersion: v1
kind: Service
metadata:
  name: {{ include "stepshell.fullname" . }}
  labels:
    {{- include "stepshell.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "stepshell.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stepshell.serviceAccountName" . }}
  labels:
    {{- include "stepshell.labels" . | nindent 4 }}
